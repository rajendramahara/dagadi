name: dagadi
description: Dagadi - route-based passenger and parcel connectivity platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  google_maps_flutter: ^2.6.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  file_picker: ^8.0.7
  firebase_core: ^2.30.0
  firebase_messaging: ^14.9.2
  firebase_auth: ^4.19.0
  intl: ^0.20.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.3
  logger: ^2.3.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
